name: Release

# Pushing a vX.Y.Z tag publishes the release: the tag is checked against the
# default branch, passing CI and manifest.json, then the Release Drafter draft is
# published for that tag and the HACS-installable zip is attached to it.
# Do not publish the draft by hand - push the tag instead.
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A commit reaching the default branch proves nothing on its own about whether
  # CI passed on it - only that it was merged. This job checks both before
  # anything is built or published.
  gate:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read # look up CI runs for the tagged commit
      contents: read # check out history to test the tag's ancestry
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH. Releases come from the default branch only."
            exit 1
          fi

      - name: Verify tag matches manifest version
        run: |
          set -euo pipefail
          version="$(jq -r .version custom_components/clawdmeter/manifest.json)"
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit that declares ${version}. Merge the version bump first, then tag the merged commit."
            exit 1
          fi

      - name: Require passing CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          for workflow in test.yml lint.yml validate.yml; do
            while true; do
              runs=$(gh api \
                "repos/${REPO}/actions/workflows/${workflow}/runs?head_sha=${SHA}&per_page=100" \
                --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"')

              if [ -z "$runs" ]; then
                echo "::error::${workflow} has never run for ${SHA}, so nothing has checked this commit."
                exit 1
              fi

              if printf '%s\n' "$runs" | awk '$2 == "success" { hit = 1 } END { exit !hit }'; then
                echo "${workflow} passed for ${SHA}."
                break
              fi

              unfinished=$(printf '%s\n' "$runs" | awk '$1 != "completed"' | wc -l)
              if [ "$unfinished" -eq 0 ]; then
                echo "::error::${workflow} ran for ${SHA} and did not pass. Refusing to release."
                printf '%s\n' "$runs" | sed 's/^/  /' >&2
                exit 1
              fi

              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for ${workflow} on ${SHA}."
                exit 1
              fi
              echo "${workflow} still running for ${SHA} - waiting."
              sleep 20
            done
          done

  release:
    name: Publish release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publish the release and upload the zip
      pull-requests: read # Release Drafter reads merged PRs for the notes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Zip integration
        run: |
          cd custom_components/clawdmeter
          zip -r clawdmeter.zip .

      - name: Publish the drafted release
        id: drafter
        uses: release-drafter/release-drafter@4d75298e00d9e34c483e5ff8c68d0ea1c1940c1e # v7.5.1
        with:
          config-name: release-drafter.yml
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.drafter.outputs.tag_name }}
        run: |
          gh release upload "$TAG" custom_components/clawdmeter/clawdmeter.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
